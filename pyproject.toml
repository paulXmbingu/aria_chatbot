version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Paul Mbingu", email = "paulxmbingu@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.1.1",
    "djangorestframework>=3.18.1",
    "google-adk[ollama]>=2.10.0",
    "gunicorn>=26.2.0",
    "litellm>=1.102.1",
    "markdown>=3.11",
    "ollama>=0.6.2",
    "openai>=2.54.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.3",
    "tiktoken>=0.14.0",
    "whitenoise>=6.12.0",
]


[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"